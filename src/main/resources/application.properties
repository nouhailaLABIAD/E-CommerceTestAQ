spring.application.name=ecommerce
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerceSpring?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# REVIEW: Répertoire d'upload externalisé (évite le chemin codé en dur)
upload.dir=src/main/resources/static/uploads/

# Configuration du mot de passe admin (obligatoire pour créer le compte admin par défaut)
# À définir via variable d'environnement : export ADMIN_PASSWORD=votre_mot_de_passe
admin.password=${ADMIN_PASSWORD:}
